<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle Radial Tree Background Orbit Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="3 5" opacity="0.8"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#334155" stroke-width="2" opacity="0.9"/>

  <!-- Radial Topic Hub Nodes -->
  <!-- Center Broker Root -->
  <circle cx="256" cy="256" r="16" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>

  <!-- Topic Spokes -->
  <line x1="256" y1="256" x2="256" y2="141" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="256" x2="355" y2="198" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="256" x2="355" y2="314" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="256" x2="256" y2="371" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="256" x2="157" y2="314" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="256" x2="157" y2="198" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Sub-nodes (Tier 1) -->
  <circle cx="256" cy="141" r="10" fill="#34d399" filter="url(#glow)"/>
  <circle cx="355" cy="198" r="9" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="355" cy="314" r="9" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="371" r="9" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="157" cy="314" r="9" fill="#34d399" filter="url(#glow)"/>
  <circle cx="157" cy="198" r="9" fill="#10b981" filter="url(#glow)"/>

  <!-- Outer Telemetry Pulse Waveform -->
  <path d="M 64 256 L 140 256 L 165 210 L 195 300 L 225 180 L 256 330 L 287 180 L 317 300 L 347 210 L 372 256 L 448 256" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
